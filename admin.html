<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>수탁 계약서 접수 목록</title>
<style>
  body { margin: 0; font: 14px "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; background: #f4f6f8; color: #17202a; }
  main { max-width: 980px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 0 0 12px; line-height: 1.5; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  input { flex: 1 1 240px; min-height: 40px; padding: 8px 10px; border: 1px solid #c5ced8; border-radius: 6px; font: inherit; }
  button { min-height: 40px; padding: 8px 14px; border-radius: 6px; border: 1px solid #1d3557; background: #1d3557; color: #fff; font: inherit; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; background: #fff; }
  th, td { border-bottom: 1px solid #e4e8ee; padding: 8px 6px; text-align: left; vertical-align: top; font-weight: 400; }
  th { font-weight: 700; background: #eef2f6; }
  .msg { min-height: 1.4em; }
  .warn { color: #a4262c; }
  a { color: #1d3557; }
</style>
</head>
<body>
<main>
  <h1>수탁 계약서 접수 목록</h1>
  <p>정우철 차장만 열람합니다. 접속 키는 이 페이지에 저장하지 않습니다. 새로고침하면 다시 입력합니다.</p>
  <div class="row">
    <input id="key" type="password" autocomplete="off" placeholder="접속 키">
    <button id="load" type="button">목록 보기</button>
  </div>
  <p class="msg" id="msg"></p>
  <table>
    <thead>
      <tr>
        <th>접수일시</th><th>상호</th><th>성명</th><th>제품</th><th>수량</th><th>호기수</th><th>발송일</th><th>서명일</th><th>이미지</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</main>
<script>
(function () {
  var API = "https://eksycrclglusqalwkwba.supabase.co/functions/v1/consignment-submit";
  var keyEl = document.getElementById("key");
  var msg = document.getElementById("msg");
  var rows = document.getElementById("rows");
  function say(text, warn) {
    msg.textContent = text || "";
    msg.className = "msg" + (warn ? " warn" : "");
  }
  function when(value) {
    var d = new Date(value);
    if (isNaN(d.getTime())) return value || "";
    return new Intl.DateTimeFormat("ko-KR", { timeZone: "Asia/Seoul", dateStyle: "medium", timeStyle: "short" }).format(d);
  }
  document.getElementById("load").addEventListener("click", async function () {
    var key = keyEl.value.trim();
    if (!key) { say("접속 키를 입력해 주세요.", true); return; }
    say("불러오는 중입니다.");
    rows.textContent = "";
    try {
      var res = await fetch(API, { headers: { "x-admin-key": key } });
      if (res.status === 401) { say("접속 키가 맞지 않습니다.", true); return; }
      if (!res.ok) { say("목록을 가져오지 못했습니다.", true); return; }
      var data = await res.json();
      var items = data.items || [];
      if (!items.length) { say("접수된 계약서가 없습니다."); return; }
      items.forEach(function (item) {
        var tr = document.createElement("tr");
        [when(item.receivedAt), item.company, item.name, item.product, item.qty, item.serial, item.shipDate, item.signedDate].forEach(function (value) {
          var td = document.createElement("td");
          td.textContent = value || "";
          tr.appendChild(td);
        });
        var td = document.createElement("td");
        var a = document.createElement("a");
        a.href = "#";
        a.textContent = "받기";
        a.addEventListener("click", async function (ev) {
          ev.preventDefault();
          var file = await fetch(API + "?id=" + encodeURIComponent(item.id), { headers: { "x-admin-key": key } });
          if (!file.ok) { say("이미지를 받지 못했습니다.", true); return; }
          var blob = await file.blob();
          var url = URL.createObjectURL(blob);
          var link = document.createElement("a");
          link.href = url;
          link.download = "수탁계약서_" + (item.company || "접수") + ".png";
          document.body.appendChild(link);
          link.click();
          link.remove();
          setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
        });
        td.appendChild(a);
        tr.appendChild(td);
        rows.appendChild(tr);
      });
      say(items.length + "건을 불러왔습니다.");
    } catch (e) {
      say("목록을 가져오지 못했습니다.", true);
    }
  });
})();
</script>
</body>
</html>
